<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Link Generator</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: "Poppins", sans-serif;

        overflow: hidden;

        background: linear-gradient(-45deg, #0f172a, #1e293b, #312e81, #4c1d95);

        background-size: 400% 400%;

        animation: gradientBG 12s ease infinite;

        padding: 20px;

        position: relative;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }

        100% {
          background-position: 0% 50%;
        }
      }

      body::before,
      body::after {
        content: "";

        position: absolute;

        width: 350px;
        height: 350px;

        border-radius: 50%;

        filter: blur(100px);

        z-index: 0;
      }

      body::before {
        background: rgba(255, 0, 128, 0.35);

        top: -100px;
        left: -100px;
      }

      body::after {
        background: rgba(0, 200, 255, 0.35);

        bottom: -100px;
        right: -100px;
      }

      .card {
        width: 100%;
        max-width: 500px;

        padding: 35px;

        border-radius: 28px;

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(14px);

        border: 1px solid rgba(255, 255, 255, 0.15);

        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);

        color: white;

        position: relative;
        z-index: 1;
      }

      .title {
        text-align: center;
        margin-bottom: 30px;
      }

      .title h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .title p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        margin-bottom: 10px;

        font-size: 15px;
        font-weight: 500;
      }

      .input-group input {
        width: 100%;

        padding: 15px 16px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        outline: none;

        border-radius: 16px;

        background: rgba(255, 255, 255, 0.1);

        color: white;

        font-size: 15px;

        transition: 0.3s ease;

        backdrop-filter: blur(10px);
      }

      .input-group input:focus {
        border-color: rgba(255, 255, 255, 0.35);

        background: rgba(255, 255, 255, 0.16);

        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1);

        opacity: 0.8;

        cursor: pointer;

        transition: 0.3s ease;
      }

      input[type="date"]::-webkit-calendar-picker-indicator:hover {
        opacity: 1;

        transform: scale(1.1);
      }

      .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      input[type="date"] {
        color-scheme: dark;
      }

      button {
        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 14px;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        background: linear-gradient(135deg, #ffb347, #ffcc33);

        color: black;

        transition: 0.3s ease;
      }

      button:hover {
        transform: translateY(-2px);

        box-shadow: 0 8px 20px rgba(255, 204, 51, 0.35);
      }

      .output-box {
        margin-top: 25px;
      }

      textarea {
        width: 100%;
        height: 120px;

        resize: none;

        border: none;
        outline: none;

        border-radius: 14px;

        padding: 16px;

        background: rgba(255, 255, 255, 0.12);

        color: white;

        font-size: 14px;

        line-height: 1.5;
      }

      textarea::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .copy-btn {
        margin-top: 14px;

        background: white;

        color: black;
      }

      .copy-btn:hover {
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.25);
      }

      .footer {
        margin-top: 20px;

        text-align: center;

        font-size: 13px;

        color: rgba(255, 255, 255, 0.6);
      }

      @media (max-width: 600px) {
        .card {
          padding: 25px;
        }

        .title h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="title">
        <h1>🎉 Birthday Link Generator</h1>
        <p>Create encrypted birthday countdown links</p>
      </div>

      <div class="input-group">
        <label>Friend Name</label>

        <input type="text" id="name" placeholder="Enter your friend's name" />
      </div>

      <div class="input-group">
        <label>Date of Birth</label>

        <input type="date" id="dob" />
      </div>

      <button onclick="generateLink()">Generate Encrypted Link 🚀</button>

      <div class="output-box">
        <textarea
          id="output"
          readonly
          placeholder="Your encrypted birthday link will appear here..."
        ></textarea>

        <button class="copy-btn" onclick="copyLink()">Copy Link 📋</button>
      </div>

      <div class="footer">Made with ❤️ by Mariya Babu</div>
    </div>

    <script>
      function encryptName(name) {
        let result = "";

        for (let i = 0; i < name.length; i++) {
          result += String.fromCharCode(name.charCodeAt(i) + 1);
        }

        return result;
      }

      function encryptDOB(dob) {
        return dob
          .split("")
          .map((char) => {
            if (!isNaN(char) && char !== "-") {
              return Number(char) + 1;
            }

            if (char === "-") {
              return ".";
            }

            return char;
          })
          .join("");
      }

      function generateLink() {
        const name = document.getElementById("name").value.trim();

        const dob = document.getElementById("dob").value;

        if (!name || !dob) {
          alert("Please enter both name and DOB");

          return;
        }

        const encryptedName = encryptName(name);

        const encryptedDOB = encryptDOB(dob);

        const combined = encryptedName + "_" + encryptedDOB;

        const encoded = btoa(combined);

        const finalURL =
          "https://mariya-babu.github.io/Advanced-Birthday-Wishes/HappyBirthday.html?data=" +
          encoded;

        document.getElementById("output").value = finalURL;
      }

      function copyLink() {
        const output = document.getElementById("output");

        if (!output.value) {
          alert("Generate a link first");

          return;
        }

        navigator.clipboard.writeText(output.value);

        alert("Link copied successfully 🚀");
      }
    </script>
  </body>
</html>
